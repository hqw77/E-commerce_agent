services:
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo-root-change-me}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-demo-root-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - demo-mysql-data:/var/lib/mysql

  agent:
    build:
      context: ./backend
    container_name: demo-agent
    environment:
      AGENT_ENV: staging
      AGENT_AUTH_MODE: hmac
      AGENT_INTERNAL_SECRET: ${AGENT_INTERNAL_SECRET:?请在 .env.demo 中设置 AGENT_INTERNAL_SECRET}
      AGENT_RESUME_TOKEN_MODE: hmac
      AGENT_RESUME_SECRET: ${AGENT_RESUME_SECRET:-demo-resume-secret-change-me}
      AGENT_APPROVAL_MODE: strict
      AGENT_STATE_BACKEND: sql
      AGENT_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-demo-root-change-me}@mysql:3306/${MYSQL_DATABASE:-agent_demo}?charset=utf8mb4
      AGENT_STRICT_BUSINESS_RECHECK: "1"
      ECOMMERCE_BASE_URL: http://ecommerce-service:8081
      AGENT_SERVICE_AUTH_TOKEN: ${AGENT_SERVICE_AUTH_TOKEN:-demo-agent-service}
      AGENT_ECOMMERCE_SERVICE_TOKEN: ${AGENT_SERVICE_AUTH_TOKEN:-demo-agent-service}
      AGENT_CORS_ORIGINS: http://localhost:8081
      AGENT_OFFLINE_RAG: ${AGENT_OFFLINE_RAG:-1}
      AGENT_DISABLE_LLM: ${AGENT_DISABLE_LLM:-1}
      AGENT_OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:-}
      AGENT_OPENAI_BASE_URL: ${AGENT_OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      AGENT_OPENAI_MODEL: ${AGENT_OPENAI_MODEL:-Qwen/Qwen3-8B}
      AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  ecommerce-service:
    build:
      context: ./ecommerce-backend
    container_name: demo-ecommerce
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-agent_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo-root-change-me}
      SPRING_PROFILES_ACTIVE: course-debug
      AGENT_SERVICE_BASE_URL: http://agent:8000
      AGENT_SERVICE_AUTH_TOKEN: ${AGENT_SERVICE_AUTH_TOKEN:-demo-agent-service}
      AGENT_AUTH_MODE: hmac
      AGENT_INTERNAL_SECRET: ${AGENT_INTERNAL_SECRET:?请在 .env.demo 中设置 AGENT_INTERNAL_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  demo-mysql-data:
